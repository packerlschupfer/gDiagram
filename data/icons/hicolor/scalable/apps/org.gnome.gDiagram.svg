<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#62a0ea"/>
      <stop offset="100%" style="stop-color:#1c71d8"/>
    </linearGradient>
    <linearGradient id="pane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#eef1f6"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b2d5c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <g filter="url(#drop)">
    <rect x="20" y="28" width="88" height="72" rx="10" fill="url(#pane)"/>
  </g>
  <rect x="59" y="28" width="2.5" height="72" fill="#c7d2e2"/>

  <!-- left: source. Three lines, not six: at 16 px more lines are a smear. -->
  <g fill="#8aa0bb">
    <rect x="29" y="47" width="22" height="6" rx="3"/>
    <rect x="29" y="61" width="15" height="6" rx="3"/>
    <rect x="29" y="75" width="19" height="6" rx="3"/>
  </g>
  <rect x="29" y="47" width="10" height="6" rx="3" fill="#1c71d8"/>

  <!-- right: two nodes and the edge between them -->
  <path d="M 79 55 L 79 65 Q 79 69 83 69 L 90 69" stroke="#1c71d8" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M 98 69 L 89 63.5 L 89 74.5 Z" fill="#1c71d8"/>
  <rect x="68" y="41" width="22" height="15" rx="4.5" fill="#1c71d8"/>
  <rect x="78" y="76" width="22" height="15" rx="4.5" fill="#1c71d8"/>
