<?xml version="1.0" encoding="UTF-8"?>
<!-- gDiagram symbolic icon: the same idea as the app icon, drawn on the 16 px
     grid where the full icon turns to mush - a split window, text on the left,
     two linked nodes on the right. Single colour, as symbolics must be. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <g fill="#222222">
    <!-- window outline -->
    <path d="M 2 2.5 A 1.5 1.5 0 0 1 3.5 1 h 9 A 1.5 1.5 0 0 1 14 2.5 v 11
             A 1.5 1.5 0 0 1 12.5 15 h -9 A 1.5 1.5 0 0 1 2 13.5 Z
             M 3 2.5 v 11 a 0.5 0.5 0 0 0 0.5 0.5 h 9 a 0.5 0.5 0 0 0 0.5 -0.5
             v -11 A 0.5 0.5 0 0 0 12.5 2 h -9 A 0.5 0.5 0 0 0 3 2.5 Z"/>
    <!-- divider -->
    <rect x="7.6" y="2" width="0.8" height="12"/>
    <!-- source lines -->
    <rect x="4.2" y="4.4" width="2.8" height="1" rx="0.5"/>
    <rect x="4.2" y="7.2" width="2" height="1" rx="0.5"/>
    <rect x="4.2" y="10" width="2.5" height="1" rx="0.5"/>
    <!-- two nodes and the edge -->
    <rect x="9" y="3.8" width="3.4" height="2.4" rx="0.7"/>
    <rect x="9.8" y="9.8" width="3.4" height="2.4" rx="0.7"/>
    <path d="M 10.2 6.6 v 1.6 a 0.6 0.6 0 0 0 0.6 0.6 h 0.6" stroke="#222222"
          stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M 12.2 8.8 L 10.9 8.1 v 1.4 Z"/>
  </g>
</svg>
