name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Keep in step with .github/workflows/release.yml — the cache key is derived
  # from this, so the two workflows share one Graphviz build.
  GV_COMMIT: 09e05516758a1e448b652412197c37b0b05286ea  # tag 14.1.3

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson \
          ninja-build \
          valac \
          libgtk-4-dev \
          libadwaita-1-dev \
          libgtksourceview-5-dev \
          libgee-0.8-dev \
          librsvg2-dev \
          libcairo2-dev \
          libsoup-3.0-dev \
          libjson-glib-dev \
          libsecret-1-dev \
          desktop-file-utils \
          gettext \
          appstream \
          libpango1.0-dev \
          libgd-dev \
          libexpat1-dev \
          libltdl-dev \
          bison \
          flex \
          locales
        # A comma-decimal locale so the locale guard in the test suite actually runs:
        # printf("%f") follows LC_NUMERIC and a German desktop made Graphviz reject our
        # DOT ("nodesep=0,8333"). Without this the test skips and proves nothing here.
        sudo locale-gen de_AT.UTF-8

    - name: Cache patched Graphviz
      id: cache-graphviz
      uses: actions/cache@v5
      with:
        path: /opt/graphviz-patched
        # The SAME key the release workflow uses. They were different
        # (graphviz-14.1.3-… here, graphviz-<commit>-… there), and a cache is
        # scoped to the ref that saved it with only the default branch shared —
        # so a tag run could never reuse what CI warmed on main and rebuilt
        # Graphviz from scratch every release. That is a 35-minute clone whose
        # one transient GitLab disconnect failed the v0.1.2 release outright.
        key: graphviz-${{ env.GV_COMMIT }}-${{ runner.os }}

    # Our HTML <TD> text-centering fix merged upstream (2cddb8456) and first
    # shipped in graphviz 14.1.3 — build from the upstream release tag; the
    # old packerlschupfer/graphviz fork branch no longer exists.
    - name: Build and install Graphviz 14.1.3
      if: steps.cache-graphviz.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://gitlab.com/graphviz/graphviz.git \
          --branch 14.1.3 /tmp/graphviz
        cmake -B /tmp/graphviz/build -S /tmp/graphviz \
          -DCMAKE_INSTALL_PREFIX=/opt/graphviz-patched
        make -C /tmp/graphviz/build -j$(nproc)
        sudo make -C /tmp/graphviz/build install

    - name: Configure Graphviz environment
      run: |
        echo "PKG_CONFIG_PATH=/opt/graphviz-patched/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/opt/graphviz-patched/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
        echo "/opt/graphviz-patched/bin" >> $GITHUB_PATH

    - name: Configure
      # debugoptimized (-O2), NOT the meson default debug (-O0): every shipped
      # artifact — deb, AppImage, flatpak — is built optimised, and two round-9
      # bugs (a boxed `double?` read inside a conditional, which valac frees
      # before the read) were invisible at -O0 and only surfaced in the deb job.
      # CI now tests what users actually get.
      run: meson setup build --prefix=/usr --buildtype=debugoptimized

    - name: Build
      run: meson compile -C build

    - name: Test
      run: meson test -C build --print-errorlogs

    - name: Validate desktop file
      run: desktop-file-validate build/data/org.gnome.gDiagram.desktop

    - name: Validate metainfo
      run: appstreamcli validate --no-net data/org.gnome.gDiagram.metainfo.xml || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: gdiagram-build
        path: build/src/gdiagram
